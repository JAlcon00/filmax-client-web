<div class="skeleton-grid">
  <div *ngFor="let _ of skeletons" class="skeleton-card">
    <!-- Poster skeleton -->
    <div class="skeleton-card__poster"></div>

    <!-- Content skeleton -->
    <div class="skeleton-card__body">
      <!-- Title skeleton -->
      <div class="skeleton-card__line skeleton-card__line--title"></div>

      <!-- Year skeleton -->
      <div class="skeleton-card__line skeleton-card__line--meta"></div>

      <!-- Rating skeleton -->
      <div class="skeleton-card__line skeleton-card__line--rating"></div>
    </div>
  </div>
</div>
