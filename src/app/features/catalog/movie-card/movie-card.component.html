<article class="movie-card" (click)="openModal()" role="button" tabindex="0"
  [attr.aria-label]="'Ver detalle de ' + movie.title"
  (keydown.enter)="openModal()" (keydown.space)="openModal()">
  <button
    class="movie-card__favorite"
    type="button"
    aria-label="Agregar a favoritos (pendiente)"
    title="Favorito (pendiente)"
    (click)="$event.stopPropagation()"
  >
    <i [class]="icons.heart" aria-hidden="true"></i>
  </button>

  <img
    [src]="movie.imageUrl"
    [alt]="movie.title"
    class="movie-card__poster"
    loading="lazy"
    (error)="onPosterError($event)"
  />

  <div class="movie-card__body">
    <h3>{{ movie.title }}</h3>
    <p class="movie-card__meta">
      <span>
        <i [class]="icons.calendar" aria-hidden="true"></i>
        {{ movie.year }}
      </span>
      <span *ngIf="movie.type">
        <i [class]="movie.type === 'series' ? icons.collection : icons.ticket" aria-hidden="true"></i>
        {{ movie.type === 'series' ? 'Serie' : 'Película' }}
      </span>
    </p>

    <div class="movie-card__rating" [attr.aria-label]="'Calificacion ' + movie.rating + ' de 5'">
      <ng-container *ngFor="let star of stars; trackBy: trackByStar">
        <i
          [class]="icons.star"
          [class.is-empty]="star > starCount"
          aria-hidden="true"
        ></i>
      </ng-container>
      <span>{{ movie.ratingLabel }}</span>
    </div>
  </div>
</article>
